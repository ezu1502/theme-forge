<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Theme Forge</title>

        <link rel="stylesheet" href="style.css">
        <script src="logic.js"></script>
    </head>

    <body>
        <header>
            <nav class="forge-nav">
                <div class="menus">
                    <div class="menu">
                        <button class="menu-button">File</button>

                        <div class="dropdown">
                            <button>New</button>
                            <button id="import-button">Import</button>
                            <button id="export-button">Export</button>
                        </div>
                    </div>

                    <div class="menu">
                        <button class="menu-button">Themes</button>

                        <div class="dropdown">
                            <button>Default</button>
                            <button>Dark</button>
                            <button>Light</button>
                            <button>Habanero</button>
                        </div>
                    </div>

                    <div class="menu">
                        <button class="menu-button">Help</button>

                        <div class="dropdown">
                            <button id="help-button">About</button>
                            <button>GitHub</button>
                        </div>
                    </div>

                </div>
                
                <h1 class="title">Theme Forge</h1>

            </nav>
        </header>
        <main id="editor-page">
            <section class="settings">
                <h2>Settings</h2>

                <div class="color-categories">
                    <div class="color-item">
                        <label for="background">Background</label>
                        <input type="color" id="background" value="#121314">
                    </div>

                    <div class="color-item">
                        <label for="foreground">Foreground</label>
                        <input type="color" id="foreground" value="#EEEEEE">
                    </div>

                    <div class="color-item">
                        <label for="plain-code">Plain Code</label>
                        <input type="color" id="plain-code" value="#B5CEA8">
                    </div>

                    <div class="color-item">
                        <label for="keyword">Keyword</label>
                        <input type="color" id="keyword" value="#ff7b72">
                    </div>

                    <div class="color-item">
                        <label for="function">Function</label>
                        <input type="color" id="function" value="#D2A8FF">
                    </div>

                    <div class="color-item">
                        <label for="string">String</label>
                        <input type="color" id="string" value="#A5D6FF">
                    </div>

                    <div class="color-item">
                        <label for="primitive-type">Primitive Type</label>
                        <input type="color" id="primitive-type" value="#FF7B72">
                    </div>

                    <div class="color-item">
                        <label for="library-type">Library Type</label>
                        <input type="color" id="library-type" value="#4EC9B0">
                    </div>

                    <div class="color-item">
                        <label for="modifier">Modifier</label>
                        <input type="color" id="modifier" value="#569CD6">
                    </div>

                    <div class="color-item">
                        <label for="constant">Constant</label>
                        <input type="color" id="constant" value="#79C0FF">
                    </div>

                    <div class="color-item">
                        <label for="parameter">Parameter</label>
                        <input type="color" id="parameter" value="#FFA657">
                    </div>

                    <div class="color-item">
                        <label for="comment">Comment</label>
                        <input type="color" id="comment" value="#8B949E">
                    </div>
                </div>
            </section>
            
            <div class="view-and-options">
                <section class="preview">
                    <h2>Preview</h2>
                    
                    <div class="preview-body">
                        <div class="code-line">
                            <span class="primitive-type">int</span>
                            <span class="code">number =</span>
                            <span class="code">15</span><span class="code">;</span>
                        </div>

                        <div class="code-line">
                            <span class="modifier">const</span>
                            <span class="library-type">std</span><span class="code">::</span><span class="library-type">string</span>
                            <span class="constant">NAME</span>
                            <span class="code">=</span>
                            <span class="string">"Theme Forge"</span><span class="code">;</span>
                        </div>
                        <div class="code-line">
                            <span class="keyword">if</span>
                            <span class="code">(</span><span class="constant">name</span>
                            <span class="code">==</span>
                            
                            <span class="string">"VS Code"</span><span class="code">){</span>
                        </div>

                        <div class="code-line indent-1">
                            <span class="function">printf</span><span class="code">(</span><span class="string">"Hello world"</span><span class="code">);</span><br>
                        </div>

                        <div class="code-line">
                            <span class="code">}</span>
                        </div>

                        <div class="code-line">
                            <span class="comment">//this is a comment.</span>
                        </div>
                    </div>

                </section>

                <section class="options">
                    <h2>Options</h2>
                    <div id="options-content">
                        <button class="forge-button" id="apply-button">Apply</button>
                        <button class="forge-button" id="clear-edit-button">Clear</button>
                        <button class="forge-button" id="clear-changes-button">Reset Theme</button>
                    </div>

                    
                </section>
            </div>
        </main> 

        <main id="help-page">
            <h2>Theme Forge - Help</h2>

            <!-- TODO continuar daqui! Terminar o help-page -->
        </main>
    </body>
</html>
