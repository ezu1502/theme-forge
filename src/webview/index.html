<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Theme Forge</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1 class="title">Theme Forge</h1>
        <main>
        
            <section class="settings">
                <h2>Settings</h2>

                <div class="color-categories">
                    <div class="color-item">
                        <label for="background">Background</label>
                        <input type="color" id="background">
                    </div>
                    <div class="color-item">
                        <label for="foreground">Foreground</label>
                        <input type="color" id="foreground">
                    </div>
                </div>
            </section>
            
            <div class="view-and-options">
                <section class="preview">
                    <h2>Preview</h2>
                    
                    <div class="preview-body">
                        <code>
                            <div class="code-line">
                                <span class="keyword">const</span>
                                <span>name =</span>
                                <span class="string">"Theme Forge"</span><span>;</span>
                            </div>
                            <div class="code-line">
                                <span class="keyword">if</span><span> (name == </span>
                                <span class="string">"VS Code"){</span>
                            </div>

                            <div class="code-line indent-1">
                                <span class="function">printf</span><span>(</span><span class="string">"Hello world"</span><span>);</span><br>
                            </div>

                            <div class="code-line">
                                <span>}</span>
                            </div>
                        </code>
                    </div>

                </section>

                <section class="options">
                    <h2>Options</h2>
                </section>
            </div>
        </main> 
    </body>
</html>
